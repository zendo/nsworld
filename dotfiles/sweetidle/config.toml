[general]
# Noctalia/dms 自己监听 logind Lock，所以不要在这里再执行
# `loginctl lock-session`，否则会反复触发 Lock 信号。
# lock_command = "loginctl lock-session"
# unlock_command = "your-locker-control unlock"
# 挂起前通用锁屏：请求 logind 锁屏，并等待 Locker 真正拿到 session lock。
before_sleep_command = "lock-session-wait"
after_resume_command = "niri msg action power-on-monitors"
wait_before_sleep = true
ignore_dbus_inhibit = false
ignore_systemd_inhibit = false

# Report the session as idle to logind after five minutes.
[idle_hint]
timeout = 300

[[listener]]
timeout = 300
on_timeout = "loginctl lock-session"
# Lock even when media playback or another application inhibits idle actions
ignore_inhibit = true

[[listener]]
timeout = 600
on_timeout = "niri msg action power-off-monitors"
on_resume = "niri msg action power-on-monitors"
# Keep outputs on while any compositor, D-Bus, or systemd inhibitor is active
ignore_inhibit = false
