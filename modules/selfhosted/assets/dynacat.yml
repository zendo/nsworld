pages:
  - name: Startpage
    width: slim
    center-vertically: true
    columns:
      - size: full
        widgets:
          - type: search
            search-engine: google
            autofocus: true
            new-tab: true
          - type: monitor
            cache: 1m
            title: Services
            sites:
              - title: Navidrome
                url: http://192.168.2.30:4539
                icon: sh:navidrome
              - title: miniflux
                url: http://192.168.2.30:51832
                icon: si:rss
              - title: memos
                url: http://192.168.2.30:5239
                icon: sh:memos
              - title: comigo
                url: http://192.168.2.30:1239
                icon: sh:getcomics
              - title: suwayomi
                url: http://192.168.2.30:8789
                icon: sh:suwayomi
              - title: goshs
                url: http://192.168.2.30:8009
                icon: sh:gossa
              - title: aria2
                url: http://192.168.2.30:6819
                icon: sh:aria2
              - title: rqbit
                url: http://192.168.2.30:3039
                icon: sh:qbittorrent
              - title: sub-store
                url: http://192.168.2.30:3009
                icon: si:crayon
              - title: Beszel Hub
                url: http://192.168.2.30:8099
                icon: sh:beszel
              - title: AdGuard Home
                url: https://yourdomain.com/
                icon: si:adguard
              - title: Vaultwarden
                url: https://yourdomain.com/
                icon: si:vaultwarden
          - type: bookmarks
            groups:
              - title: General
                links:
                  - title: Gmail
                    url: https://mail.google.com/mail/u/0/
                  - title: Github
                    url: https://github.com/
                  - title: Nixsearch
                    url: https://nixsearch.thekoppe.com/
              - title: Social
                links:
                  - title: Reddit
                    url: https://www.reddit.com/
                  - title: Twitter
                    url: https://twitter.com/
                  - title: Youtube
                    url: https://www.youtube.com/
      - size: small
        widgets:
          - type: to-do
            storage: local
          # - type: repository
          #   repository: NixOS/nixpkgs
          - type: clock
            hour-format: 24h
          - type: calendar
            first-day-of-week: monday
