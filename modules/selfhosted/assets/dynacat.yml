server:
  host: 0.0.0.0
  port: 8088
  cache-dir: /var/cache/dynacat
  db-path: /var/lib/dynacat/dynacat.db
branding:
  hide-logo: true
  custom-footer: |
    <p>Powered by ❄️</p>
