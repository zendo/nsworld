pages:
  - name: Startpage
    width: slim
    center-vertically: true
    columns:
      - size: full
        widgets:
          - type: search
            autofocus: true
          - type: monitor
            cache: 1m
            title: Services
            sites:
              - title: Navidrome
                url: http://192.168.2.218:4539
                icon: sh:navidrome
              - title: miniflux
                url: http://192.168.2.218:8081
                icon: si:rss
              - title: comigo
                url: http://192.168.2.218:1239
                icon: sh:getcomics
              - title: goshs
                url: http://192.168.2.218:8009
                icon: sh:gossa
              - title: AdGuard Home
                url: https://yourdomain.com/
                icon: si:adguard
              - title: Vaultwarden
                url: https://yourdomain.com/
                icon: si:vaultwarden
          - type: bookmarks
            groups:
              - title: General
                links:
                  - title: Gmail
                    url: https://mail.google.com/mail/u/0/
                  - title: Github
                    url: https://github.com/
                  - title: Nixsearch
                    url: https://nixsearch.thekoppe.com/
              - title: Social
                links:
                  - title: Reddit
                    url: https://www.reddit.com/
                  - title: Twitter
                    url: https://twitter.com/
                  - title: Instagram
                    url: https://www.instagram.com/
              - title: Entertainment
                links:
                  - title: YouTube
                    url: https://www.youtube.com/
                  - title: Prime Video
                    url: https://www.primevideo.com/
                  - title: Disney+
                    url: https://www.disneyplus.com/
