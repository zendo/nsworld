server:
  host: 127.0.0.1
  port: 4301
  cache-dir: /var/cache/dynacat
  db-path: /var/lib/dynacat/dynacat.db
branding:
  hide-logo: true
  custom-footer: |
    <p>Powered by ❄️</p>
# auth:
#   # generate with: ./dynacat secret:make
#   secret-key: g9Gv4/KjPs4jX0KG2IO8lVobdLCVtteo8aBRMebxLZtG8yf9gH1MMUM0VuSuagNVOjGjZN2cQcfI69O2IBfF0g==
#   users:
#     admin:
#     password: qwertyuiop[]
pages:
  - name: Startpage
    width: slim
    center-vertically: true
    columns:
      - size: full
        widgets:
          - type: search
            search-engine: google
            autofocus: true
            new-tab: true
          - type: monitor
            cache: 1m
            title: Services
            sites:
              - title: Navidrome
                url: http://navidrome.home.arpa
                icon: sh:navidrome
              - title: miniflux
                url: http://miniflux.home.arpa
                icon: si:rss
              - title: fusion
                url: http://fusion.home.arpa
                icon: si:rss
              - title: memos
                url: http://memos.home.arpa
                icon: sh:memos
              - title: comigo
                url: http://comigo.home.arpa
                icon: sh:getcomics
              - title: suwayomi
                url: http://suwayomi.home.arpa
                icon: sh:suwayomi
              - title: goshs
                url: http://goshs.home.arpa
                icon: sh:gossa
              - title: aria2
                url: http://aria2.home.arpa
                icon: sh:aria2
              - title: rqbit
                url: http://rqbit.home.arpa
                icon: sh:qbittorrent
              - title: sub-store
                url: http://sub-store.home.arpa
                icon: si:crayon
              - title: Beszel Hub
                url: http://beszel.home.arpa
                icon: sh:beszel
              - title: scrutiny
                url: http://scrutiny.home.arpa
                icon: sh:scrutiny
              # 还没上线,先注释掉,免得 monitor 一直显示 down
              # - title: AdGuard Home
              #   url: http://adguard.home.arpa
              #   icon: si:adguard
              # - title: Vaultwarden
              #   url: http://vaultwarden.home.arpa
              #   icon: si:vaultwarden
          - type: bookmarks
            groups:
              - title: General
                links:
                  - title: Gmail
                    url: https://mail.google.com/mail/u/0/
                  - title: Github
                    url: https://github.com/
                  - title: Nixsearch
                    url: https://nixsearch.thekoppe.com/
              - title: Social
                links:
                  - title: Reddit
                    url: https://www.reddit.com/
                  - title: Twitter
                    url: https://twitter.com/
                  - title: Youtube
                    url: https://www.youtube.com/
      - size: small
        widgets:
          - type: to-do
            storage: local
          # - type: repository
          #   repository: NixOS/nixpkgs
          - type: clock
            hour-format: 24h
          - type: calendar
            first-day-of-week: monday
